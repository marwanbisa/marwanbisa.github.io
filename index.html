<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1677e8">
<title>BIMTEK TERPADU</title>
<style>
:root{
  --blue:#1677e8;--blue2:#0d5dcc;--navy:#12345a;--bg:#f4f8fd;--card:#fff;
  --text:#17345b;--muted:#71819a;--line:#e4edf7;--green:#27b17e;
  --orange:#f39a24;--purple:#7b4ee8;--red:#ef6262;
  --shadow:0 10px 28px rgba(23,65,115,.09)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.app{min-height:100vh;display:flex}
.sidebar{
  width:116px;background:linear-gradient(180deg,#103b67 0%,#0c3156 100%);
  color:#fff;position:fixed;left:0;top:0;bottom:0;z-index:50;padding:14px 10px;
  box-shadow:6px 0 24px rgba(9,42,77,.15);overflow-y:auto
}
.home-logo{
  width:66px;height:66px;margin:0 auto 14px;border-radius:18px;
  display:grid;place-items:center;background:linear-gradient(135deg,#1d8cff,#1464dc);
  box-shadow:0 10px 22px rgba(0,0,0,.16);font-size:35px
}
.brand-mini{text-align:center;font-size:11px;font-weight:900;letter-spacing:.5px;margin-bottom:15px}
.nav{display:grid;gap:6px}
.nav button{
  width:100%;border:0;background:transparent;color:#eaf3ff;border-radius:13px;
  padding:11px 4px 10px;text-align:center;font-weight:700;font-size:11px;transition:.18s
}
.nav button .ico{display:block;font-size:23px;line-height:1;margin-bottom:6px}
.nav button:hover,.nav button.active{background:#1e79e8;color:#fff;box-shadow:0 7px 16px rgba(0,0,0,.14)}
.nav-section{font-size:8px;text-transform:uppercase;color:#9bb9d9;text-align:center;margin:13px 0 4px;font-weight:800}
.main{margin-left:116px;width:calc(100% - 116px);min-height:100vh}
.topbar{
  min-height:82px;padding:15px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;
  color:#fff;background:linear-gradient(105deg,#0e70df,#1c86ed 60%,#1774d9);
  position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(21,103,196,.16)
}
.topbar:after{content:"";position:absolute;right:0;top:0;width:43%;height:100%;opacity:.14;
  background:radial-gradient(circle at 20% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 70%,#fff 0 2px,transparent 3px);background-size:70px 70px}
.top-title{position:relative;z-index:1}
.top-title h1{font-size:22px;margin:0 0 3px;font-weight:900;letter-spacing:.2px}
.top-title p{margin:0;font-size:12px;opacity:.92}
.profile{position:relative;z-index:1;display:flex;align-items:center;gap:11px}
.bell{width:40px;height:40px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:50%;color:#fff;font-size:19px}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:21px;font-weight:900}
.profile small{display:block;opacity:.85}.profile strong{display:block;font-size:12px}
.content{padding:25px 28px 45px;max-width:1500px;margin:auto}
.hero{
  border:1px solid #dcecff;border-radius:22px;background:linear-gradient(135deg,#fafdff,#eef7ff);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px
}
.hero-head{display:flex;justify-content:space-between;gap:15px;align-items:center}
.eyebrow{font-size:10px;color:var(--blue);font-weight:900;letter-spacing:1.3px}
.hero h2{margin:5px 0 5px;font-size:24px}
.hero p{margin:0;color:var(--muted)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1.45fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.card-head h3{margin:0;font-size:17px}.card-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.announcement{padding:13px 2px;border-bottom:1px solid #edf2f8;display:flex;gap:12px;align-items:flex-start}
.announcement:last-child{border-bottom:0}
.aicon{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.a-red{background:#fff0f0;color:var(--red)}.a-blue{background:#eaf4ff;color:var(--blue)}.a-green{background:#eafbf4;color:var(--green)}.a-purple{background:#f3efff;color:var(--purple)}
.announcement strong{font-size:14px}.announcement p{margin:4px 0 5px;font-size:12px;color:var(--muted);line-height:1.45}.date{font-size:10px;color:#8997aa}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;background:#edf5ff;color:var(--blue)}
.badge.red{background:#fff0f0;color:var(--red)}.badge.green{background:#eafbf4;color:#18885f}.badge.orange{background:#fff5e7;color:#bd6a00}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 8px;text-align:center;transition:.18s;color:var(--text)}
.quick button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.quick .qico{font-size:24px;margin-bottom:8px}.quick strong{font-size:12px;display:block}.quick span{font-size:10px;color:var(--muted);display:block;margin-top:4px}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.room{
  min-height:205px;border-radius:18px;padding:18px;color:#fff;display:flex;flex-direction:column;
  justify-content:space-between;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.room:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-60px;top:-60px;background:rgba(255,255,255,.13)}
.room.blue{background:linear-gradient(145deg,#187ff0,#1265d0)}.room.green{background:linear-gradient(145deg,#39bd8c,#20a777)}
.room.orange{background:linear-gradient(145deg,#ffad3b,#ef8915)}
.room .r-icon{font-size:27px}.room h3{margin:9px 0 4px;font-size:18px}.room p{margin:0;opacity:.9;font-size:11px;line-height:1.45;max-width:220px}
.btn{
  border:0;border-radius:11px;padding:10px 15px;font-weight:800;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px
}
.btn.primary{background:var(--blue);color:#fff}.btn.light{background:#fff;color:#18559a}.btn.outline{background:#fff;border:1px solid #d8e6f5;color:var(--blue)}
.room .btn{align-self:flex-start;margin-top:13px;min-width:108px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:11px 12px;border-bottom:1px solid #edf2f7;text-align:left;white-space:nowrap}th{background:#f7faff;color:#52657d;font-size:10px;text-transform:uppercase}tr:last-child td{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #dce7f3;border-radius:10px;outline:none;background:#fff;color:var(--text)}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#79b6f5;box-shadow:0 0 0 3px #e9f4ff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.form-list{display:grid;gap:10px}.form-card{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.form-card .fc-icon{font-size:23px}.form-card strong{display:block;font-size:13px}.form-card span{font-size:10px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,30,55,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:15px}.modal-backdrop.show{display:flex}.modal{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#f1f5f9;width:34px;height:34px;border-radius:50%}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:12px}
.toast{position:fixed;right:20px;bottom:20px;background:#153b62;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:200;font-size:12px;display:none}.toast.show{display:block}
.mobile-toggle{display:none;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:9px}
.section-title{margin:0 0 14px;font-size:22px}.section-sub{margin:-8px 0 18px;color:var(--muted);font-size:12px}
.kpi{display:flex;align-items:center;gap:12px}.kpi-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:#eaf4ff;color:var(--blue)}.kpi strong{font-size:20px}.kpi span{display:block;font-size:10px;color:var(--muted)}
.notice{padding:11px 13px;border-radius:11px;background:#f4f9ff;border:1px solid #dcecff;color:#4c6683;font-size:11px;line-height:1.5}
.footer{text-align:center;color:#8a99ad;font-size:10px;padding:20px}
@media(max-width:900px){
  .sidebar{width:82px}.main{margin-left:82px;width:calc(100% - 82px)}.brand-mini{display:none}.home-logo{width:54px;height:54px}
  .content{padding:18px 15px 35px}.topbar{padding:13px 16px}.top-title h1{font-size:19px}.top-title p{font-size:10px}
  .g2,.g3,.g4{grid-template-columns:1fr}.rooms{grid-template-columns:1fr 1fr}.quick{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .sidebar{width:68px;padding:10px 6px}.main{margin-left:68px;width:calc(100% - 68px)}.home-logo{width:48px;height:48px;font-size:27px;border-radius:14px}.nav button{font-size:9px;padding:9px 2px}.nav button .ico{font-size:20px}.nav-section{font-size:7px}
  .topbar{min-height:70px}.profile small,.profile strong{display:none}.avatar{width:36px;height:36px}.bell{width:36px;height:36px}.content{padding:14px 10px 25px}
  .hero{padding:16px}.hero-head{align-items:flex-start;flex-direction:column}.hero h2{font-size:20px}.rooms{grid-template-columns:1fr}.quick{gap:8px}.card{padding:14px;border-radius:15px}
  .form-grid{grid-template-columns:1fr}.form-card{align-items:flex-start;flex-direction:column}.form-card .btn{width:100%}
}
<style>
.auto-attendance{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.auto-attendance .field{min-width:0}
.auto-attendance .btn{min-height:52px;font-size:16px;font-weight:800}
@media(max-width:700px){.auto-attendance{grid-template-columns:1fr}.auto-attendance .btn{width:100%}}

.attendance-export-note{font-size:13px;line-height:1.5}
@media print{
  .sidebar,.topbar,.actions,button{display:none!important}
  .card{box-shadow:none!important;border:1px solid #ddd!important}
  table{font-size:11px!important}
}
</style>
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button class="home-logo" onclick="navigate('home')" title="Beranda">⌂</button>
    <div class="brand-mini">BIMTEK<br>TERPADU</div>
    <div class="nav">
      <button data-nav="home" onclick="navigate('home')" class="active"><span class="ico">🏠</span>Beranda</button>
      <button data-nav="panitia" onclick="navigate('panitia')"><span class="ico">👥</span>Panitia</button>
      <button data-nav="rooms" onclick="navigate('rooms')"><span class="ico">🏫</span>Ruang/Kelas</button>
      <button data-nav="peserta" onclick="navigate('peserta')"><span class="ico">👤</span>Peserta</button>
      <button data-nav="sertifikat" onclick="navigate('sertifikat')"><span class="ico">🏆</span>Sertifikat</button>
      <button data-nav="dokumen" onclick="navigate('dokumen')"><span class="ico">📁</span>Dokumen</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-toggle" onclick="navigate('home')">☰</button>
      <div class="top-title">
        <h1>BIMTEK TERPADU</h1>
        <p>Meningkatkan Kompetensi, Mewujudkan Pendidikan Berkualitas</p>
      </div>
      <div class="profile">
        <button class="bell" onclick="showToast('Belum ada notifikasi baru')">🔔</button>
        <div class="avatar">👤</div>
        <div><small>Selamat Datang</small><strong>Pengguna</strong></div>
      </div>
    </header>
    <div id="appContent" class="content"></div>
    <div class="footer">BIMTEK TERPADU • Sistem Informasi Kegiatan</div>
  </main>
</div>

<div id="modal" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const KEY='bimtek_terpadu_v3';
const rooms=[
 {id:'R01',name:'Kelas SPMI',desc:'Peningkatan Mutu Sistem Penjaminan Mutu Pendidikan',cls:'blue'},
 {id:'R02',name:'Kelas SPMI LITNUM',desc:'Literasi dan Numerasi untuk Pembelajaran Berkualitas',cls:'green'},
 {id:'R03',name:'Digitalisasi',desc:'Pemanfaatan Teknologi untuk Pembelajaran Masa Depan',cls:'orange'}
];
const formTypes=[
 {key:'narasumber',icon:'👨‍🏫',name:'Registrasi Narasumber',desc:'Registrasi dan identitas narasumber'},
 {key:'materi',icon:'📚',name:'Upload Materi Besar',desc:'Materi PDF, PPT, DOC, video, ZIP, dan file besar'},
 {key:'lk',icon:'🧩',name:'Lembar Kerja / LK',desc:'Esai, pilihan ganda, atau campuran'},
 {key:'tugas',icon:'📝',name:'Form Tugas',desc:'Pembuatan dan pengelolaan tugas peserta'},
 {key:'pretest',icon:'🧠',name:'Pre Test',desc:'Form kuis awal sesuai ruang'},
 {key:'posttest',icon:'🧠',name:'Pos Test',desc:'Form kuis akhir sesuai ruang'},
 {key:'absensi',icon:'✅',name:'Absensi Sesi',desc:'Kehadiran peserta pada sesi kegiatan'}
];
const seed={
 announcements:[
  {title:'Jadwal Kegiatan Hari Ini',text:'Informasi jadwal dan rangkaian kegiatan Bimtek dapat dilihat pada agenda masing-masing ruang.',date:'22 September 2026 • 08:00',tag:'Penting',tone:'red',icon:'📣'},
  {title:'Materi Kegiatan Tersedia',text:'Narasumber dapat menambahkan materi melalui menu ruang kelas masing-masing.',date:'22 September 2026 • 09:00',tag:'Informasi',tone:'blue',icon:'📄'},
  {title:'Absensi Setiap Sesi',text:'Kehadiran peserta dikelola pada ruang kegiatan sesuai sesi yang berlangsung.',date:'22 September 2026 • 10:00',tag:'Penting',tone:'green',icon:'✓'},
  {title:'Pengumpulan Tugas',text:'Tugas yang dikumpulkan peserta akan terhubung dengan narasumber pada ruang terkait.',date:'22 September 2026 • 11:00',tag:'Informasi',tone:'purple',icon:'i'}
 ],
 peserta:[],
 narasumber:[],
 forms:{R01:{},R02:{},R03:{}},
 materi:[],tugas:[],pretests:[],posttests:[],pengumpulan:[],absensi:[],dokumen:[]
};
let db=loadDB();
function loadDB(){
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
  const out={...seed,...saved};
  out.materi=Array.isArray(out.materi)?out.materi:[];
  out.tugas=Array.isArray(out.tugas)?out.tugas:[];
  out.pretests=Array.isArray(out.pretests)?out.pretests:[];
  out.posttests=Array.isArray(out.posttests)?out.posttests:[];
  out.pengumpulan=Array.isArray(out.pengumpulan)?out.pengumpulan:[];
  out.absensi=Array.isArray(out.absensi)?out.absensi:[];
  return out;
 }catch(e){return {...seed,materi:[],tugas:[],pretests:[],posttests:[],pengumpulan:[],absensi:[]}}
}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function openModal(title,body){
 document.getElementById('modalBody').innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">✕</button></div>${body}`;
 document.getElementById('modal').classList.add('show')
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function setActive(key){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===key))}
function navigate(page,param=''){
 setActive(page==='room'? 'rooms':page);
 const el=document.getElementById('appContent');
 if(page==='home')el.innerHTML=home();
 else if(page==='panitia')el.innerHTML=panitia();
 else if(page==='rooms')el.innerHTML=roomsPage();
 else if(page==='room')el.innerHTML=roomPage(param);
 else if(page==='peserta'){el.innerHTML=pesertaPage();setTimeout(renderParticipantActivities,0);}
 else if(page==='sertifikat')el.innerHTML=sertifikatPage();
 else if(page==='dokumen')el.innerHTML=dokumenPage();
 window.scrollTo({top:0,behavior:'smooth'})
}

function home(){
 const a=db.announcements||[];
 return `
 <section class="hero">
  <div class="hero-head">
   <div><div class="eyebrow">🏠 BERANDA / RUMAH</div><h2>Pengumuman Terbaru</h2><p>Informasi penting seputar kegiatan Bimtek Terpadu.</p></div>
   <button class="btn primary" onclick="navigate('panitia')">Panel Panitia →</button>
  </div>
 </section>
 <div class="grid g2">
  <section class="card">
   <div class="card-head"><div><h3>📢 Pengumuman</h3><p>Informasi kegiatan yang diperbarui panitia</p></div><span class="badge">${a.length} informasi</span></div>
   ${a.length?a.map(x=>`<div class="announcement"><div class="aicon a-${esc(x.tone)}">${esc(x.icon)}</div><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(x.title)}</strong><span class="badge ${x.tone==='red'?'red':''}">${esc(x.tag)}</span></div><p>${esc(x.text)}</p><div class="date">🗓 ${esc(x.date)}</div></div></div>`).join(''):`<div class="empty">Belum ada pengumuman.</div>`}
  </section>
  <section class="card">
   <div class="card-head"><div><h3>⚡ Akses Cepat</h3><p>Menu utama yang sering digunakan</p></div></div>
   <div class="quick">
    <button onclick="navigate('peserta')"><div class="qico">👤</div><strong>Peserta</strong><span>Data peserta & absensi</span></button>
    <button onclick="navigate('rooms')"><div class="qico">👥</div><strong>Ruang / Kelas</strong><span>SPMI, LITNUM, Digitalisasi</span></button>
    <button onclick="navigate('sertifikat')"><div class="qico">🏆</div><strong>Sertifikat</strong><span>Generate & unduh</span></button>
    <button onclick="navigate('dokumen')"><div class="qico">📁</div><strong>Dokumen</strong><span>Materi, tugas, laporan</span></button>
   </div>
  </section>
 </div>
 <section class="card" style="margin-top:18px">
  <div class="card-head"><div><h3>🎓 Ruang / Kelas</h3><p>Pilih ruang kegiatan sesuai kebutuhan</p></div><button class="btn outline" onclick="navigate('rooms')">Lihat Semua →</button></div>
  <div class="rooms">${rooms.map(r=>`<div class="room ${r.cls}"><div><div class="r-icon">🎓</div><h3>${r.name}</h3><p>${r.desc}</p></div><button class="btn light" onclick="navigate('room','${r.id}')">Masuk →</button></div>`).join('')}</div>
 </section>
 <section class="hero" style="margin-top:18px;margin-bottom:0"><div style="display:flex;align-items:center;gap:18px"><div style="font-size:35px">🎓</div><div><strong style="font-size:14px">“Bersama kita wujudkan pendidikan yang lebih baik, lebih maju, dan lebih berkualitas.”</strong><div class="date" style="margin-top:5px">BIMTEK TERPADU</div></div></div></section>
 `;
}

function panitia(){
 return `<h2 class="section-title">Panitia</h2><p class="section-sub">Pusat pengelolaan kegiatan, pengumuman, peserta, narasumber, dan konfigurasi Form.</p>
 <div class="grid g3">
  <div class="card"><div class="kpi"><div class="kpi-icon">👥</div><div><strong>${db.peserta.length}</strong><span>Peserta</span></div></div></div>
  <div class="card"><div class="kpi"><div class="kpi-icon">👨‍🏫</div><div><strong>${db.narasumber.length}</strong><span>Narasumber</span></div></div></div>
  <div class="card"><div class="kpi"><div class="kpi-icon">🏫</div><div><strong>3</strong><span>Ruang Kegiatan</span></div></div></div>
 </div>
 <div class="grid g2" style="margin-top:18px">
  <section class="card"><div class="card-head"><div><h3>📢 Pengumuman</h3><p>Tambah pengumuman yang tampil di Beranda</p></div><button class="btn primary" onclick="announcementForm()">+ Tambah</button></div>
  ${db.announcements.map((a,i)=>`<div class="announcement"><div class="aicon a-${a.tone}">${a.icon}</div><div style="flex:1"><strong>${esc(a.title)}</strong><p>${esc(a.text)}</p><div class="actions"><button class="btn outline" onclick="editAnnouncement(${i})">Edit</button><button class="btn outline" onclick="deleteAnnouncement(${i})">Hapus</button></div></div></div>`).join('')}</section>

function downloadAttendance(scope){
 const arr=(db.absensi||[]).filter(x=>scope==='all'||x.room===scope);
 if(!arr.length){showToast('Belum ada data absensi untuk diunduh');return}

 const sorted=[...arr].sort((a,b)=>{
   const ta=Date.parse(a.timeISO||a.time||'')||0;
   const tb=Date.parse(b.timeISO||b.time||'')||0;
   return ta-tb;
 });

 const roomName=scope==='all'
   ? 'KESELURUHAN'
   : (rooms.find(r=>r.id===scope)?.name||scope);

 const rows=sorted.map((x,i)=>{
   let tanggal='', jam='';
   if(x.timeISO){
     const d=new Date(x.timeISO);
     if(!isNaN(d)){
       tanggal=d.toLocaleDateString('id-ID');
       jam=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
     }
   }
   if(!tanggal && x.time){
     const parts=String(x.time).split(',');
     tanggal=(parts[0]||'').trim();
     jam=(parts.slice(1).join(',')||'').trim();
   }
   return {
     no:i+1,tanggal,jam,
     nama:x.name||'',
     sekolah:x.school||'',
     npsn:x.npsn||'',
     ruang:rooms.find(r=>r.id===x.room)?.name||x.room||'',
     sesi:x.session||'',
     status:x.status||'Hadir',
     metode:x.metode||'Manual'
   };
 });

 const escX=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const today=new Date().toLocaleDateString('id-ID');
 const body=rows.map(r=>`
   <tr>
    <td class="center">${r.no}</td>
    <td class="center">${escX(r.tanggal)}</td>
    <td class="center">${escX(r.jam)}</td>
    <td>${escX(r.nama)}</td>
    <td>${escX(r.sekolah)}</td>
    <td class="center">${escX(r.npsn)}</td>
    <td>${escX(r.ruang)}</td>
    <td>${escX(r.sesi)}</td>
    <td class="center">${escX(r.status)}</td>
    <td class="center">${escX(r.metode)}</td>
   </tr>`).join('');

 <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
 <x:Name>Absensi</x:Name><x:WorksheetOptions><x:FreezePanes/>
 <x:FrozenNoSplit/><x:SplitHorizontal>5</x:SplitHorizontal><x:TopRowBottomPane>5</x:TopRowBottomPane>
 <x:AutoFilter x:Range="R5C1:R${rows.length+5}C10"/>
 <x:Print><x:ValidPrinterInfo/><x:PaperSizeIndex>9</x:PaperSizeIndex>
 <x:HorizontalResolution>600</x:HorizontalResolution><x:VerticalResolution>600</x:VerticalResolution>
 <x:FitToPage/><x:FitWidth>1</x:FitWidth><x:FitHeight>0</x:FitHeight></x:Print>
 </x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
 <style>
  @page{margin:0.4in;size:landscape}
  body{font-family:Calibri,Arial,sans-serif;font-size:11pt}
  .title{font-size:16pt;font-weight:bold;text-align:center}
  .subtitle{font-size:11pt;text-align:center}
  .meta{font-size:10pt}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  th{background:#1f4e78;color:white;font-weight:bold;text-align:center;vertical-align:middle;border:1px solid #7f8c8d;height:30px}
  td{border:1px solid #b7b7b7;vertical-align:middle;height:24px}
  tr:nth-child(even) td{background:#f2f6fa}
  .center{text-align:center}
  .nowrap{white-space:nowrap}
 </style>
 </head>
 <body>
  <div class="title">DAFTAR ABSENSI PESERTA</div>
  <div class="subtitle">Ruang/Kelas: <b>${escX(roomName)}</b></div>
  <div class="subtitle">Tanggal Unduh: ${escX(today)}</div>
  <br>
  <table>
   <colgroup>
    <col style="width:45px"><col style="width:90px"><col style="width:85px">
    <col style="width:190px"><col style="width:220px"><col style="width:95px">
    <col style="width:160px"><col style="width:130px"><col style="width:80px"><col style="width:90px">
   </colgroup>
   <thead>
    <tr>
     <th>No</th><th>Tanggal</th><th>Jam</th><th>Nama Peserta</th><th>Sekolah</th>
     <th>NPSN</th><th>Ruang/Kelas</th><th>Sesi</th><th>Status</th><th>Metode</th>
    </tr>
   </thead>
   <tbody>${body}</tbody>
  </table>
  <br>
  <div class="meta"><b>Jumlah Peserta/Record:</b> ${rows.length}</div>
 </body></html>`;

 const blob=new Blob(['\\ufeff',doc],{type:'application/vnd.ms-excel;charset=utf-8;'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 const stamp=new Date().toISOString().slice(0,10);
 const suffix=scope==='all'?'KESELURUHAN':roomName.replace(/[^a-z0-9]+/gi,'_').toUpperCase();
 a.download=`ABSENSI_${suffix}_${stamp}.xls`;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 showToast('✅ File Excel absensi berhasil diunduh dan sudah diformat rapi');
}

function sertifikatPage(){
 return `<h2 class="section-title">Sertifikat</h2><p class="section-sub">Pencarian dan pembuatan sertifikat peserta.</p>
 <section class="card"><div class="card-head"><div><h3>🏆 Sertifikat Peserta</h3><p>Template dapat dihubungkan ke Google Sheets/Apps Script pada tahap sinkronisasi.</p></div></div>
 ${db.peserta.length?`<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Sekolah</th><th>Ruang</th><th>Aksi</th></tr></thead><tbody>${db.peserta.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.school)}</td><td>${esc(rooms.find(r=>r.id===x.room)?.name||'-')}</td><td><button class="btn primary" onclick="certificatePreview(${i})">Lihat Sertifikat</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Data peserta belum tersedia.</div>`}
 </section>`;
}

function dokumenPage(){
 return `<h2 class="section-title">Dokumen</h2><p class="section-sub">Dokumen kegiatan, materi, tugas, dan file besar.</p>
 <section class="card"><div class="card-head"><div><h3>📁 Pusat Dokumen</h3><p>File kecil dapat ditampilkan di aplikasi; file besar diarahkan ke Google Form/Google Drive.</p></div><button class="btn primary" onclick="documentForm()">+ Tambah Dokumen</button></div>
 <div class="grid g3">
  <div class="notice">📄 <b>PDF/DOC/PPT</b><br>Dapat ditautkan dan dibuka dari aplikasi.</div>
  <div class="notice">🎬 <b>Video/File Besar</b><br>Simpan melalui Google Form File Upload dan Google Drive.</div>
  <div class="notice">🔗 <b>Link Lembar Kerja</b><br>Tautkan Form atau dokumen kerja sesuai ruang.</div>
 </div>
 <div style="margin-top:15px">${db.dokumen.length?`<div class="table-wrap"><table><thead><tr><th>Nama Dokumen</th><th>Ruang</th><th>Link</th></tr></thead><tbody>${db.dokumen.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(rooms.find(r=>r.id===x.room)?.name||'-')}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:800">Buka</a></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada dokumen.</div>`}</div>
 </section>`;
}

function pesertaForm(){
 openModal('Registrasi Peserta',`<div class="form-grid">
 <div class="field"><label>Nama Lengkap</label><input id="f_name"></div>
 <div class="field"><label>NIP/NIK</label><input id="f_nip"></div>
 <div class="field"><label>Nama Sekolah</label><input id="f_school"></div>
 <div class="field"><label>NPSN</label><input id="f_npsn"></div>
 <div class="field"><label>Jabatan/Peran</label><input id="f_role"></div>
 <div class="field"><label>WhatsApp</label><input id="f_wa"></div>
 <div class="field"><label>Email</label><input id="f_email"></div>
 <div class="field"><label>Ruang/Kelas</label><select id="f_room">${rooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select></div>
 </div><div class="actions"><button class="btn primary" onclick="savePeserta()">Simpan Peserta</button><button class="btn outline" onclick="closeModal()">Batal</button></div>`)
}
function savePeserta(){
 const x={name:v('f_name'),nip:v('f_nip'),school:v('f_school'),npsn:v('f_npsn'),role:v('f_role'),wa:v('f_wa'),email:v('f_email'),room:v('f_room')};
 if(!x.name||!x.school||!x.room){showToast('Nama, sekolah, dan ruang wajib diisi');return}
 db.peserta.push(x);saveDB();closeModal();navigate('peserta');showToast('Peserta berhasil ditambahkan')
}
function deletePeserta(i){if(confirm('Hapus peserta ini?')){db.peserta.splice(i,1);saveDB();navigate('peserta');showToast('Peserta dihapus')}}
function narasumberForm(room){
 openModal('Registrasi Narasumber — '+rooms.find(r=>r.id===room).name,`<div class="form-grid">
 <div class="field"><label>Nama Narasumber</label><input id="n_name"></div>
 <div class="field"><label>Email</label><input id="n_email"></div>
 <div class="field"><label>Materi/Bidang</label><input id="n_field"></div>
 </div><div class="actions"><button class="btn primary" onclick="saveNarasumber('${room}')">Simpan</button><button class="btn outline" onclick="closeModal()">Batal</button></div>`)
}
function saveNarasumber(room){
 const x={name:v('n_name'),email:v('n_email'),field:v('n_field'),room};
 if(!x.name){showToast('Nama narasumber wajib diisi');return}
 db.narasumber.push(x);saveDB();closeModal();navigate('room',room);showToast('Narasumber berhasil ditambahkan')
}
function getFormUrl(room,key){return db.forms?.[room]?.[key]||''}
function openRoomForm(room,key){
 const f=formTypes.find(x=>x.key===key);
 const url=getFormUrl(room,key);
 openModal(`${f.name} — ${rooms.find(r=>r.id===room).name}`,`<div class="notice">Form ini khusus <b>Narasumber</b>. Untuk file besar, gunakan Google Form File Upload agar file tersimpan di Google Drive.</div>
 <div class="field" style="margin-top:13px"><label>URL Google Form</label><input id="form_url" value="${esc(url)}" placeholder="https://docs.google.com/forms/..."></div>
 <div class="actions"><button class="btn primary" onclick="saveFormUrl('${room}','${key}')">Simpan URL</button>${url?`<button class="btn outline" onclick="window.open('${esc(url)}','_blank','noopener')">Buka Form ↗</button>`:''}</div>`)
}
function saveFormUrl(room,key){
 const url=v('form_url').trim();if(!url){showToast('URL Google Form belum diisi');return}
 if(!db.forms[room])db.forms[room]={};db.forms[room][key]=url;saveDB();closeModal();navigate('room',room);showToast('URL Form tersimpan')
}
function announcementForm(index=null){
 const a=index==null?{title:'',text:'',date:'',tag:'Informasi',tone:'blue',icon:'📢'}:db.announcements[index];
 openModal(index==null?'Tambah Pengumuman':'Edit Pengumuman',`<div class="form-grid">
 <div class="field"><label>Judul</label><input id="a_title" value="${esc(a.title)}"></div>
 <div class="field"><label>Label</label><select id="a_tag"><option>Informasi</option><option>Penting</option><option>Agenda</option></select></div>
 <div class="field" style="grid-column:1/-1"><label>Isi</label><textarea id="a_text">${esc(a.text)}</textarea></div>
 <div class="field"><label>Tanggal/Jam</label><input id="a_date" value="${esc(a.date)}"></div>
 </div><div class="actions"><button class="btn primary" onclick="saveAnnouncement(${index==null?-1:index})">Simpan</button></div>`)
}
function saveAnnouncement(i){
 const x={title:v('a_title'),text:v('a_text'),date:v('a_date'),tag:v('a_tag'),tone:v('a_tag')==='Penting'?'red':'blue',icon:v('a_tag')==='Penting'?'📣':'📄'};
 if(!x.title||!x.text){showToast('Judul dan isi wajib diisi');return}
 if(i<0)db.announcements.unshift(x);else db.announcements[i]=x;saveDB();closeModal();navigate('panitia');showToast('Pengumuman tersimpan')
}
function editAnnouncement(i){announcementForm(i)}
function deleteAnnouncement(i){if(confirm('Hapus pengumuman ini?')){db.announcements.splice(i,1);saveDB();navigate('panitia');showToast('Pengumuman dihapus')}}
function documentForm(){
 openModal('Tambah Dokumen',`<div class="form-grid"><div class="field"><label>Nama Dokumen</label><input id="d_name"></div><div class="field"><label>Ruang</label><select id="d_room">${rooms.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Link Google Drive / Dokumen</label><input id="d_url" placeholder="https://drive.google.com/..."></div></div><div class="actions"><button class="btn primary" onclick="saveDocument()">Simpan</button></div>`)
}
function saveDocument(){const x={name:v('d_name'),room:v('d_room'),url:v('d_url')};if(!x.name||!x.url){showToast('Nama dan link wajib diisi');return}db.dokumen.push(x);saveDB();closeModal();navigate('dokumen');showToast('Dokumen ditambahkan')}
function certificatePreview(i){
 const p=db.peserta[i],r=rooms.find(x=>x.id===p.room);
 openModal('Pratinjau Sertifikat',`<div style="border:5px double #2c73c9;padding:35px;text-align:center;border-radius:8px;background:#fbfdff"><div style="font-size:12px;font-weight:800;letter-spacing:2px">SERTIFIKAT</div><h2 style="margin:12px 0">BIMTEK TERPADU</h2><p>Diberikan kepada</p><h2 style="color:#175fae">${esc(p.name)}</h2><p>Asal satuan pendidikan: <b>${esc(p.school)}</b></p><p>Ruang: <b>${esc(r?.name||'-')}</b></p><p style="margin-top:25px;color:#71819a">Nomor sertifikat akan dihasilkan oleh sistem pada tahap sinkronisasi.</p></div><div class="actions"><button class="btn primary" onclick="window.print()">🖨 Cetak</button></div>`)
}
function v(id){return document.getElementById(id)?.value||''}
navigate('home');
</script>
</body>
</html>
